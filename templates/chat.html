<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 지원 챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --error: #ef4444;
      --radius: 12px;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-title h1 { font-size: 18px; font-weight: 700; }
    .header-title p { font-size: 12px; opacity: .75; margin-top: 2px; }
    .admin-link {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      padding: 7px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      transition: background .2s;
    }
    .admin-link:hover { background: rgba(255,255,255,.25); }

    /* ── Chat Area ── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 40px 16px 24px;
      color: var(--text-muted);
    }
    .welcome .wi { font-size: 52px; margin-bottom: 16px; }
    .welcome h2 { font-size: 20px; color: var(--text); font-weight: 700; margin-bottom: 8px; }
    .welcome p { font-size: 14px; line-height: 1.7; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
    .sug-btn {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .sug-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Messages ── */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 82%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .bot .avatar  { background: var(--primary); }
    .user .avatar { background: #475569; }

    .msg-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .user .msg-content { align-items: flex-end; }

    .bubble {
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
    }
    .bot .bubble {
      background: var(--white);
      border-radius: 4px 16px 16px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.07);
      color: var(--text);
    }
    .user .bubble {
      background: var(--primary);
      color: #fff;
      border-radius: 16px 4px 16px 16px;
    }
    .ts { font-size: 11px; color: var(--text-muted); }

    /* Markdown inside bot bubble */
    .bot .bubble h1,.bot .bubble h2,.bot .bubble h3 {
      font-size: 15px; margin: 10px 0 5px; font-weight: 700;
    }
    .bot .bubble p { margin: 5px 0; }
    .bot .bubble ul,.bot .bubble ol { margin: 5px 0 5px 18px; }
    .bot .bubble li { margin: 3px 0; }
    .bot .bubble code {
      background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
      font-family: 'Consolas', monospace; font-size: 13px;
    }
    .bot .bubble pre {
      background: #1e293b; color: #e2e8f0;
      padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0;
    }
    .bot .bubble pre code { background: none; color: inherit; padding: 0; }
    .bot .bubble strong { font-weight: 700; }
    .bot .bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .bot .bubble blockquote {
      border-left: 3px solid var(--primary); padding-left: 12px;
      color: var(--text-muted); margin: 6px 0;
    }

    /* Typing dots */
    .typing { display: flex; align-items: center; gap: 5px; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px; background: #94a3b8; border-radius: 50%;
      animation: bounce 1.3s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Error text */
    .err-text { color: var(--error); font-size: 13px; }

    /* ── Input Area ── */
    .input-area {
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .input-wrap {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--primary); }
    #msgInput {
      width: 100%; border: none; background: transparent; outline: none;
      font-size: 14.5px; font-family: inherit; color: var(--text);
      resize: none; max-height: 120px; line-height: 1.5;
    }
    #msgInput::placeholder { color: #94a3b8; }
    .send-btn {
      width: 44px; height: 44px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
    }
    .send-btn:hover { background: var(--primary-dark); }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">🤖</div>
    <div class="header-title">
      <h1>시스템 지원 챗봇</h1>
      <p>시스템 문의 및 조치 가이드 안내</p>
    </div>
  </div>
  <a href="/admin" class="admin-link">⚙️ 관리자</a>
</header>

<div id="chatContainer">
  <div class="welcome" id="welcome">
    <div class="wi">💬</div>
    <h2>무엇을 도와드릴까요?</h2>
    <p>시스템 관련 문의 사항을 입력하시면<br>해결 방법과 조치 가이드를 안내해 드립니다.</p>
    <div class="suggestions" id="suggestions"></div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1"
      placeholder="질문을 입력하세요... (Enter: 전송 / Shift+Enter: 줄바꿈)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" title="전송">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  marked.setOptions({ breaks: true, gfm: true });

  const container = document.getElementById('chatContainer');
  const input     = document.getElementById('msgInput');
  const sendBtn   = document.getElementById('sendBtn');
  let busy = false;

  /* ── Auto-resize textarea ── */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  /* ── Load suggestion buttons ── */
  async function loadSuggestions() {
    try {
      const cats = await fetch('/api/categories').then(r => r.json());
      const wrap = document.getElementById('suggestions');
      const defaults = ['비밀번호 변경 방법', '오류 코드 해결', '시스템 접속 불가'];
      (cats.length ? cats.map(c => c + ' 관련 문의') : defaults).slice(0, 4).forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'sug-btn';
        btn.textContent = label;
        btn.onclick = () => { input.value = label; send(); };
        wrap.appendChild(btn);
      });
    } catch (_) {}
  }
  loadSuggestions();

  /* ── Helpers ── */
  function now() {
    return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }
  function esc(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }
  function scrollBottom() {
    container.scrollTop = container.scrollHeight;
  }

  function appendUser(text) {
    document.getElementById('welcome')?.remove();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar">👤</div>
      <div class="msg-content">
        <div class="bubble">${esc(text)}</div>
        <span class="ts">${now()}</span>
      </div>`;
    container.appendChild(row);
    scrollBottom();
  }

  function appendBot(id) {
    document.getElementById('welcome')?.remove();
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="msg-content">
        <div class="bubble" id="${id}">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
        <span class="ts">${now()}</span>
      </div>`;
    container.appendChild(row);
    scrollBottom();
    return document.getElementById(id);
  }

  /* ── Send ── */
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendUser(text);
    const msgId  = 'bot-' + Date.now();
    const bubble = appendBot(msgId);

    let full = '';
    let buf  = '';

    try {
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!res.ok) {
        const err = await res.json();
        bubble.innerHTML = `<span class="err-text">오류: ${esc(err.detail ?? '알 수 없는 오류')}</span>`;
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      bubble.innerHTML = '';

      outer: while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buf.indexOf('\n')) !== -1) {
          const line = buf.slice(0, idx);
          buf = buf.slice(idx + 1);

          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') break outer;
          try {
            const parsed = JSON.parse(data);
            if (parsed.text) {
              full += parsed.text;
              bubble.innerHTML = marked.parse(full);
              scrollBottom();
            }
          } catch (_) {}
        }
      }

      if (!full) bubble.innerHTML = '<em class="err-text">응답을 받지 못했습니다.</em>';

    } catch (_) {
      bubble.innerHTML = '<span class="err-text">연결 오류가 발생했습니다. 다시 시도해주세요.</span>';
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
      scrollBottom();
    }
  }
</script>
</body>
</html>
